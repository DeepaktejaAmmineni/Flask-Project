<!DOCTYPE html>
<html>

<head>
    <title>Result</title>
</head>

<body>

    <h1>Student Result</h1>

    <p>Name: {{ name }}</p>

    <p>Marks: {{ marks }}</p>

    {% if status == "Pass" %}

        <h2>Congratulations! You Passed.</h2>

    {% else %}

        <h2>Better Luck Next Time.</h2>

    {% endif %}

    <h3>Status: {{ status }}</h3>

    <br>

    <a href="/">Check Another Student</a>

</body>

</html>
